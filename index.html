<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>LOG IN</title>
        <style>
            body{margin:0;padding:0;font-family:Arial, Helvetica, sans-serif;background-color:rgb(227, 228, 228)}
            header{background-color:blue;text-align:center;color:white;padding:9px;width:100%;position:fixed;top:0;}
            .colored{color:#fd6464;}
            main{margin-left:20%;margin-right:20%;padding:9px;box-shadow:0 0 3px 2px rgba(0,0,0,.4);background-color:white;margin-top:30%;}
            .center{text-align:center;}
            ul{list-style-type: none;}
            input{width:90%;border-radius:4%;height:40px;border:2px solid grey;margin-bottom:15px;background-color:rgb(221, 217, 217);text-align:center;}
            input[type="checkbox"]{width:16px;height:16px;}
            button[type="submit"],.register{width:80%;color:white;background-color:blue;font-weight:bold;padding:9px;font-size:17px;margin-bottom:19px;margin-left:47px;border-radius:6%;}
            .register{background-color:brown;}
            .alert1{text-align:center;font-weight:bold;font-size:19px;}
            .alert2{background-color:rgb(69, 255, 239);padding:5px;text-align:center;}
            .forgot,.reminder{text-align:center;margin:10px;}
            a{text-decoration: none;}
            .log-in-alert{background-color:red;text-align:center;padding:30px;display:none;}
            .show{display:flex;justify-content:center;align-items:center;}
            .dots{vertical-align:top;font-size:20px;animation:mAnime 2s linear infinite;}
            @keyframes mAnime{0%{transform:scale(0.2) rotate(0)} 50%{transform:scale(1.2);background-color:white;}51%{background-color:red;transform:scale(1.4) rotate(180deg)} 80%{background-color:white;} 100%{transform:scale(0.2) rotate(360deg)}}
            @media (max-width:768px) {main{margin-left:40px;margin-right:40px;padding:9px;}}

            </style>
        
    </head>
    <body>
        <header>
            <h1>BENSONTECH <b class="colored">Funded</b></h1>

        </header>
        <main>
            <p class="alert1">◾️◾️◾️Sign In To Your Account◾️◾️◾️</p>
            <p class="alert2">Log in using your <br>email and password<br>
                or <a href="#"><b>CLICK HERE</b></a> to register</p>
                 <p id="alert1" class="log-in-alert"><span class="dots">🔸🔹🔸🔸</span> Loading your details<br>please wait</p>
                <section>
                    <form action="#">
                        <ul role="tablist">
                           <li class="center"> <label for="email">Enter your Email:</label></li>
                           <li><input role="tab" type="email" id="email" aria-required="true" placeholder="enter email"></li>
                          
                           <li class="center"><label for="password">Enter Password:</label></li>
                           <li><input type="password" role="tab" id="password" required placeholder="enter password" pattern="Benison"></li>
                           <li id="alert" class="alert"></li>
                           <li><label><input type="checkbox">Remember me</label></li>
                           <li class="forgot"><a href="#">Forgot Password?</a></li>

                        </ul>
                        <button role="tab" aria-disabled="false" id="login" type="submit">Log In</button>
                    </form>
                    <p class="reminder">Dont have an Account?</p>
                    <button class="register">Register</button>

                </section>
        </main>
        <script>
            const alert1El=document.getElementById("alert1");
            const alertEl=document.getElementById("alert");
            const buttonEl=document.getElementById("login")
            const emailInput=document.getElementById("email")
            const passwordInput=document.getElementById("password")

            buttonEl.addEventListener("click",()=>{ const email=emailInput.value.trim();
                const password= passwordInput.value.trim();
                if(email && password){
                buttonEl.textContent="...loging in";setTimeout(()=>{
                alert1El.classList.toggle("show")},1000)
                buttonEl.setAttribute("aria-disabled","true")
                buttonEl.style.opacity="0.6";
                buttonEl.style.pointerEvents="none"}
        } )
        </script>
    </body>
    </html>
